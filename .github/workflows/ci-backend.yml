name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend
        shell: bash
    
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'
    - name: "Install dependencies"
      run: npm ci
    - name: "Run linting"
      run: npm run lint
    - name: "Running tests"
      run: npm test