name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
    
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js '24.X'
      uses: actions/setup-node@v4
      with:
        node-version: '24.X'
        cache: 'npm'
    - name : "Install dependencies"
      run: |
        npm ci
    - name : "Running tests"
      run: |
        npm run test
    - name : "Run linting"
      run: |
        echo "Running linting"
        npm run lint
    - name : "Run linting"
      run: |
        echo "Running linting"
        npm run lint